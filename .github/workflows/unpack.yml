name: Unpack Zip
on:
  push:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -f roblox_story_pro_bot.zip ]; then
            unzip -o roblox_story_pro_bot.zip
            rm -f roblox_story_pro_bot.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Unpack pro roblox story kit"
            git push
          fi
